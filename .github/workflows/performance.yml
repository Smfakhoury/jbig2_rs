name: Generated performance comparison

on:
  pull_request:
  push:
    branches: [main]
    tags: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.89.0
      - name: Validate real slowdown and exact-output controls
        run: python -B tools/check_performance_controls.py --output-dir target/performance-controls
      - name: Compare generated outputs and informational same-host timings
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: >-
          python -B tools/run_performance.py
          --base-ref "$BASE_REF"
          --output-dir target/performance-comparison
      - name: Summarize correctness and informational timing scope
        if: always()
        shell: bash
        run: |
          if [[ -f target/performance-comparison/report.md ]]; then
            cat target/performance-comparison/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: generated-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/performance-comparison/report.json
            target/performance-comparison/*.json
            target/performance-comparison/*.log
            target/performance-comparison/report.md
            target/performance-controls/control-report.json
            target/performance-controls/*/*.json
            target/performance-controls/*/*.log
            target/performance-controls/*/*.md
