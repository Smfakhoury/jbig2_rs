name: Pinned Verus bootstrap

on:
  pull_request:
  push:
    branches: [main]
    tags: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  whole:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.groups.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install audit dependencies
        run: python -m pip install -r tools/requirements.txt
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.98.1
      - run: python tools/verify_provenance.py
      - run: python tools/audit_runtime.py
      - name: Download pinned Verus
        run: |
          curl --fail --location --retry 3 --retry-all-errors --retry-delay 2 \
            --retry-max-time 60 --connect-timeout 10 --max-time 30 --output verus.zip \
            https://github.com/verus-lang/verus/releases/download/release/0.2026.10.04.426d8b0/verus-0.2026.10.04.426d8b0-x86-linux.zip
          echo "624018662868563a7bec0dd07be5e4dd0c3d61124b4b55105765884bf2d4d1a0  verus.zip" |
            sha256sum --check
          unzip -q verus.zip
      - name: Verify proof build and audit production coverage
        run: |
          set -o pipefail
          mkdir -p target/verus-production
          export PATH="$PWD/verus-x86-linux:$PATH"
          export CARGO_TARGET_DIR="$PWD/target/verus-cargo"
          cargo fetch --manifest-path verification/Cargo.toml --locked
          cargo verus build --manifest-path verification/Cargo.toml --locked --offline -- \
            --num-threads 4 \
            --rlimit 30 \
            --triggers-mode silent \
            --output-json > target/verus-production/cargo-reports.jsons
          python tools/extract_cargo_verus_report.py \
            --input target/verus-production/cargo-reports.jsons \
            --output verus-production.json \
            --compiled-library target/verus-cargo/debug/libjbig2_rs_production.rlib
          cp target/verus-cargo/debug/libjbig2_rs_production.rlib target/verus-production/
          python tools/audit_production_coverage.py \
            --verus-json verus-production.json \
            --output production-proof-coverage-ci.json \
            --require-complete
          diff -u production-proof-coverage.json \
            production-proof-coverage-ci.json
          python tools/check_traceability.py \
            --verus-json verus-production.json \
            --output target/traceability/verifier-report.json
      - name: Stage whole-crate outputs including failed diagnostics
        if: always()
        run: |
          mkdir -p target/semantic-ci/whole
          for path in verus-production.json production-proof-coverage-ci.json target/traceability target/verus-production; do
            if [ -e "$path" ]; then cp -r --parents "$path" target/semantic-ci/whole/; fi
          done
      - name: Seal whole-crate evidence and enumerate every semantic group
        id: groups
        run: |
          python -B tools/run_semantic_proofs.py --seal-whole target/semantic-ci/whole
          echo "matrix=$(python -B tools/run_semantic_proofs.py --matrix)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: verus-partial-${{ github.run_id }}-${{ github.run_attempt }}-whole
          path: target/semantic-ci/whole/

  semantic:
    needs: whole
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.whole.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install audit dependencies
        run: python -m pip install -r tools/requirements.txt
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.98.1
      - run: python tools/verify_provenance.py
      - run: python tools/audit_runtime.py
      - name: Download pinned Verus
        run: |
          curl --fail --location --retry 3 --retry-all-errors --retry-delay 2 \
            --retry-max-time 60 --connect-timeout 10 --max-time 30 --output verus.zip \
            https://github.com/verus-lang/verus/releases/download/release/0.2026.10.04.426d8b0/verus-0.2026.10.04.426d8b0-x86-linux.zip
          echo "624018662868563a7bec0dd07be5e4dd0c3d61124b4b55105765884bf2d4d1a0  verus.zip" |
            sha256sum --check
          unzip -q verus.zip
      - name: Check every complete semantic group assigned to this shard
        env:
          SEMANTIC_SHARD: ${{ matrix.shard }}
        run: >-
          python -B tools/run_semantic_proofs.py
          --shard "$SEMANTIC_SHARD"
          --verus-executable verus-x86-linux/verus
          --output-dir "target/semantic-ci/group/target/traceability"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: verus-partial-${{ github.run_id }}-${{ github.run_attempt }}-shard-${{ matrix.shard }}
          path: target/semantic-ci/group/

  verify:
    if: always()
    needs: [whole, semantic]
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install audit dependencies
        run: python -m pip install -r tools/requirements.txt
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: verus-partial-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: target/semantic-inputs
          merge-multiple: false
      - name: Require successful jobs and exact complete same-run evidence
        env:
          WHOLE_RESULT: ${{ needs.whole.result }}
          SEMANTIC_RESULT: ${{ needs.semantic.result }}
        run: >-
          python -B tools/run_semantic_proofs.py
          --aggregate target/semantic-inputs
          --whole-result "$WHOLE_RESULT" --semantic-result "$SEMANTIC_RESULT"
          --output-dir target/semantic-canonical
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: verus-bootstrap-log
          path: target/semantic-canonical/
