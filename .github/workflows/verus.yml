name: Pinned Verus bootstrap

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install audit dependencies
        run: python -m pip install -r tools/requirements.txt
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.98.1
      - run: python tools/verify_provenance.py
      - run: python tools/audit_runtime.py
      - name: Download pinned Verus
        run: |
          curl --fail --location --output verus.zip \
            https://github.com/verus-lang/verus/releases/download/release/0.2026.10.04.426d8b0/verus-0.2026.10.04.426d8b0-x86-linux.zip
          echo "624018662868563a7bec0dd07be5e4dd0c3d61124b4b55105765884bf2d4d1a0  verus.zip" |
            sha256sum --check
          unzip -q verus.zip
      - name: Verify proof build and audit production coverage
        run: |
          set -o pipefail
          mkdir -p target/verus-production
          verus-x86-linux/verus src/lib.rs \
            --crate-name jbig2_rs_production \
            --crate-type rlib \
            --compile \
            --out-dir target/verus-production \
            --cfg verus_keep_ghost \
            --num-threads 4 \
            --rlimit 30 \
            --triggers-mode silent \
            --output-json > verus-production.json
          python - <<'PY'
          import json
          report = json.load(open("verus-production.json", encoding="utf-8"))
          result = report["verification-results"]
          assert result["success"]
          assert result["errors"] == 0
          PY
          python tools/audit_production_coverage.py \
            --verus-json verus-production.json \
            --output production-proof-coverage-ci.json \
            --require-complete
          diff -u production-proof-coverage.json \
            production-proof-coverage-ci.json
          python tools/check_traceability.py \
            --verus-json verus-production.json \
            --output target/traceability/verifier-report.json
      - name: Check reset proof semantic sensitivity
        run: >-
          python -B tools/check_reset_proof.py
          --verus-executable verus-x86-linux/verus
          --output target/traceability/reset-proof-sensitivity.json
      - name: Check document count proof semantic sensitivity
        run: >-
          python -B tools/check_document_count_proof.py
          --verus-executable verus-x86-linux/verus
          --output target/traceability/document-count-proof-sensitivity.json
      - name: Check bitmap materialization proof semantic sensitivity
        run: >-
          python -B tools/check_bitmap_copy_proofs.py
          --verus-executable verus-x86-linux/verus
          --output target/traceability/bitmap-copy-proof-sensitivity.json
      - name: Check segment retention proof semantic sensitivity
        run: >-
          python -B tools/check_retention_proofs.py
          --verus-executable verus-x86-linux/verus
          --output target/traceability/retention-proof-sensitivity.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: verus-bootstrap-log
          path: |
            verus-production.json
            production-proof-coverage-ci.json
            target/traceability/
