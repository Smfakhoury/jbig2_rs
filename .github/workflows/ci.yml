name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  cargo:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install audit dependencies
        run: python -m pip install -r tools/requirements.txt
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: clippy,rustfmt
      - name: Test validation gates
        run: python -B -m unittest discover -s tools/tests -v
      - run: python tools/verify_provenance.py
      - run: python tools/audit_runtime.py
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - name: Check executable negative and metamorphic catalogs
        run: >-
          python -B tools/check_test_catalogs.py --discover-tests
          --output target/traceability/test-catalogs.json
      - name: Check provisional normative links and real test discovery
        run: >-
          python -B tools/check_traceability.py --discover-tests
          --output target/traceability/reference-report.json
      - run: cargo doc --no-deps
      - name: Audit package contents
        shell: bash
        run: cargo package --allow-dirty --list | python tools/audit_package.py
      - run: cargo package --allow-dirty
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: traceability-${{ matrix.os }}
          path: target/traceability/

  distribution:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        toolchain: ["1.89.0", stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: Test isolated proof-free distribution
        run: >-
          python -B tools/check_distribution.py
          --toolchain ${{ matrix.toolchain }}
          --output target/distribution/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: distribution-${{ matrix.os }}-${{ matrix.toolchain }}
          path: target/distribution/report.json
