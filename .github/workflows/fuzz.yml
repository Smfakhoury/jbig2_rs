name: Bounded fuzz validation

on:
  pull_request:
  push:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      profile:
        description: Campaign duration
        type: choice
        options: [smoke, extended]
        default: smoke

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PROFILE: ${{ github.event_name == 'schedule' && 'extended' || inputs.profile || 'smoke' }}
      TRUSTED_CORPUS: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly-2026-10-12
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: corpus
        if: env.TRUSTED_CORPUS == 'true'
        with:
          path: target/fuzz-corpus
          key: fuzz-generated-v1-${{ runner.os }}-${{ hashFiles('examples/fuzz_seeds.rs', 'tools/distribution_consumer.rs', 'tests/support/context_scenarios.rs', 'benchmarks/generated.rs') }}-${{ github.run_id }}
          restore-keys: |
            fuzz-generated-v1-${{ runner.os }}-${{ hashFiles('examples/fuzz_seeds.rs', 'tools/distribution_consumer.rs', 'tests/support/context_scenarios.rs', 'benchmarks/generated.rs') }}-
      - name: Validate failure capture and single-input replay
        run: python -B tools/check_fuzz_controls.py --output-dir target/fuzz-controls
      - name: Run all bounded fuzz targets
        id: campaign
        run: >-
          python -B tools/run_fuzz.py run
          --profile "$PROFILE"
          --corpus-dir target/fuzz-corpus
          --output-dir target/fuzz-run
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: success() && env.TRUSTED_CORPUS == 'true'
        with:
          path: target/fuzz-corpus
          key: ${{ steps.corpus.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: fuzz-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/fuzz-run/
            target/fuzz-controls/
